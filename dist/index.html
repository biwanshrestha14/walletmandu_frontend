    <meta

    <meta
      name="description"
      content="WalletMandu — considered wallets and everyday essentials. Based in Nepal."
    />
    <title>WalletMandu — Carry a little better.</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('walletmandu-theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#000000' : '#faf7f2';
      })();
    </script>
